<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>GIVEDIS OS — Pilotage commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#060c18; --bg2:#0b1424; --panel:#101c31; --panel2:#16253f;
  --line:#1f3352; --line2:#2c4569;
  --ink:#e6eefc; --ink2:#9fb2d4; --ink3:#6a7fa5;
  --acc:#4d9bff; --acc2:#8cc2ff; --acc-dim:rgba(77,155,255,.14); --acc-deep:#1e5fb8;
  --ok:#2fbf71; --warn:#f0a13b; --bad:#e0576a; --info:#22c6d8;
  --r:14px; --r2:10px;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  --maxw:1400px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 82% -12%, rgba(77,155,255,.11), transparent 62%),
    radial-gradient(900px 520px at 4% 2%, rgba(34,198,216,.07), transparent 58%),
    var(--bg);
  color:var(--ink);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4,.disp{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Shell ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(6,12,24,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mark{
  width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;
  filter:drop-shadow(0 4px 14px rgba(77,155,255,.3))
}
.brand .mark svg{width:38px;height:38px;display:block}
.brand.haslogo .mark{
  width:auto;height:auto;
  background:linear-gradient(180deg,#fff,#eef2f8);
  border-radius:9px;padding:6px 11px;
  box-shadow:0 3px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.6);
  filter:none
}
.brand .mark img{max-width:150px;max-height:26px;width:auto;height:auto;object-fit:contain;display:block}
.brand.haslogo .nm{display:none}
.brand.haslogo .sub{margin-top:5px}
.logo-drop{
  border:1.5px dashed var(--line2);border-radius:var(--r2);padding:26px;text-align:center;
  background:var(--bg2);cursor:pointer;transition:.15s
}
.logo-drop:hover{border-color:var(--acc);background:var(--acc-dim)}
.logo-prev{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:18px;display:grid;place-items:center;min-height:110px}
.logo-prev img{max-width:100%;max-height:90px;object-fit:contain}
.logo-prev.light{background:#fff}
.brand .nm{font-family:'Rajdhani';font-weight:700;font-size:21px;line-height:1}
.brand .sub{font-size:10.5px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

.spaces{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.space-btn{
  background:none;border:0;padding:8px 15px;border-radius:9px;cursor:pointer;
  font-family:'Rajdhani';font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);transition:.16s;white-space:nowrap
}
.space-btn:hover{color:var(--ink2)}
.space-btn.on{background:var(--acc);color:#04101f}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.who{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.who label{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em}
.who select{background:none;border:0;font-weight:600;color:var(--acc2);cursor:pointer;outline:none}
.who select option{background:var(--panel)}

/* ---------- Tabs ---------- */
.tabsbar{border-bottom:1px solid var(--line);background:rgba(11,20,36,.6)}
.tabs{max-width:var(--maxw);margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 13px;cursor:pointer;color:var(--ink3);white-space:nowrap;
  font-weight:500;font-size:13.5px;transition:.15s
}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--acc2);border-bottom-color:var(--acc)}

main{max-width:var(--maxw);margin:0 auto;padding:20px 16px 90px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- Building blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:18px;letter-spacing:.02em}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.45}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--acc);opacity:.75}
.kpi.ok::after{background:var(--ok)} .kpi.bad::after{background:var(--bad)} .kpi.info::after{background:var(--info)}
.kpi .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.kpi .val{font-family:'Rajdhani';font-weight:700;font-size:31px;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:3px}

.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s}
.bar i.ok{background:linear-gradient(90deg,#1f9c58,var(--ok))}
.bar i.bad{background:linear-gradient(90deg,#a83a48,var(--bad))}

label.f{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:5px}
input,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);
  padding:10px 12px;outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
textarea{min-height:88px;resize:vertical}
select option{background:var(--panel)}
.field{margin-bottom:13px}

.btn{
  background:var(--acc);color:#04101f;border:0;border-radius:var(--r2);
  padding:10px 17px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap
}
.btn:hover{background:var(--acc2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

.chip{
  background:var(--bg2);border:1px solid var(--line);border-radius:99px;
  padding:7px 14px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s;user-select:none
}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--acc);color:#04101f;border-color:var(--acc);font-weight:600}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}

.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.03em}
.tag.ok{background:rgba(47,191,113,.15);color:var(--ok)}
.tag.warn{background:rgba(240,161,59,.15);color:var(--warn)}
.tag.bad{background:rgba(224,87,106,.15);color:var(--bad)}
.tag.info{background:rgba(74,168,224,.15);color:var(--info)}
.tag.mute{background:var(--panel2);color:var(--ink3)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;padding:9px 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line2);white-space:nowrap
}
td{padding:10px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--panel2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
th.fige,td.fige{position:sticky;left:0;z-index:2;background:var(--panel);
  box-shadow:1px 0 0 var(--line)}
tbody tr:hover td.fige{background:var(--panel2)}
tfoot td.fige{background:var(--panel)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:38px 18px;color:var(--ink3)}
.empty .big{font-size:34px;opacity:.35;margin-bottom:8px}
.empty p{margin:0 0 14px}

.note{border-left:3px solid var(--info);background:rgba(34,198,216,.08);padding:11px 14px;border-radius:0 var(--r2) var(--r2) 0;font-size:13px;color:var(--ink2)}
.note.warn{border-color:var(--warn);background:rgba(240,161,59,.07)}
.note.ok{border-color:var(--ok);background:rgba(47,191,113,.07)}

.chartbox{position:relative;height:290px}
.chartbox.sm{height:210px}

/* Toast */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);
  padding:11px 17px;border-radius:var(--r2);box-shadow:var(--shadow);font-size:14px;
  animation:up .25s ease;max-width:90vw
}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Modal */
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,8,18,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal-in{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);width:min(680px,100%);max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.split{grid-template-columns:1fr}}

@media(max-width:640px){
  main{padding:14px 12px 80px}
  .card{padding:14px}
  .kpi .val{font-size:26px}
  .topbar-in{padding:9px 12px;gap:9px}
  .brand .nm{font-size:18px}
  .space-btn{padding:7px 11px;font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand" id="brand">
      <div class="mark" id="brandMark"></div>
      <div>
        <div class="nm">GIVEDIS OS</div>
        <div class="sub">Pilotage · Performance · Données</div>
      </div>
    </div>
    <nav class="spaces" id="spaces"></nav>
    <div class="topbar-right">
      <div class="who">
        <label for="yearSel">Exercice</label>
        <select id="yearSel" onchange="setYear(this.value)"></select>
      </div>
      <button class="btn ghost sm" onclick="go('data','sauvegarde')">Sauvegarde</button>
    </div>
  </div>
</header>

<div class="tabsbar"><nav class="tabs" id="tabs"></nav></div>

<main id="main"></main>

<div id="toasts"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-in" id="modalIn"></div></div>

<script>
/* ==========================================================================
   GIVEDIS OS — socle de données
   Espace de noms gos_*. Les applications existantes (CRM, Suivi Visites,
   Chiffre semaine) ne sont jamais modifiées : lecture seule à l'import.
   ========================================================================== */

const LS = 'gos_db';
const SCHEMA = 9;

const DEFAULT_CRITERES = [
  {id:'c_ca',      label:"Chiffre d'affaires",       type:'ca',        cible:60000, montant:250, actif:true, mode:'auto',   param:0, cibleSource:'objectifCA'},
  {id:'c_marge',   label:"Marge dégagée",            type:'marge',     cible:18000, montant:200, actif:true, mode:'auto',   param:0},
  {id:'c_txmarge', label:"Taux de marge",            type:'txmarge',   cible:30,    montant:150, actif:true, mode:'auto',   param:0},
  {id:'c_nvx',     label:"Nouveaux clients ouverts", type:'nouveaux',  cible:4,     montant:150, actif:true, mode:'auto',   param:0},
  {id:'c_vis',     label:"Visites réalisées",        type:'visites',   cible:40,    montant:100, actif:true, mode:'auto',   param:0},
  {id:'c_rdv',     label:"RDV qualifiés",            type:'rdv',       cible:12,    montant:100, actif:true, mode:'auto',   param:0},
  {id:'c_txtr',    label:"Taux de transformation",   type:'txtransfo', cible:35,    montant:100, actif:true, mode:'auto',   param:0},
  {id:'c_depass',  label:"Objectif CA dépassé de 10 %", type:'txobjectif', cible:110, montant:300, actif:true, mode:'seuil', param:0},
  {id:'c_nvx800',  label:"Nouveaux clients à plus de 800 € de première commande",
                                                     type:'nvxseuil',  cible:2,     montant:200, actif:true, mode:'auto',   param:800}
];

/* Critères ajoutés après coup : on les greffe sur les règles déjà enregistrées. */
function completerCriteres(){
  if(!DB.primes || !Array.isArray(DB.primes.criteres)) return;
  DB.primes.criteres.forEach(c => {
    if(c.mode === undefined)  c.mode = 'auto';
    if(c.param === undefined) c.param = 0;
    /* La cible du critère de CA suit désormais l'objectif mensuel saisi. */
    if(c.cibleSource === undefined) c.cibleSource = (c.id === 'c_ca' && c.type === 'ca') ? 'objectifCA' : 'fixe';
  });
  ['c_depass','c_nvx800'].forEach(id => {
    if(!DB.primes.criteres.some(c => c.id === id)){
      const modele = DEFAULT_CRITERES.find(c => c.id === id);
      if(modele) DB.primes.criteres.push(JSON.parse(JSON.stringify(modele)));
    }
  });
}

function blankDb(){
  return {
    schema: SCHEMA,
    commerciaux: [
      {id:'clement', nom:'Clément', actif:true},
      {id:'lorris',  nom:'Lorris',  actif:true}
    ],
    clients: [],
    visites: [],
    semaines: [],
    officiels: {},
    rdvs: [],
    objectifs: {annuel:{}, mensuel:{}},
    primes: {
      criteres: JSON.parse(JSON.stringify(DEFAULT_CRITERES)),
      gate: {actif:true, type:'ca', seuil:80, label:"Palier d'ouverture : % de l'objectif CA à atteindre"},
      proratisation: true
    },
    settings: {logo:null, logoDim:null, logoPrevLight:true,
               rdvQualifie: {resultats:['Commande','Devis émis'], types:['Rendez-vous devis']},
               rentabilite: {coutDefaut:5000, couts:{}, tauxMarge:null}},
    meta: {createdAt:new Date().toISOString(), lastImport:null}
  };
}

let DB = null;
let WHO = null;
let YEAR = null;

function load(){
  try{
    const raw = localStorage.getItem(LS);
    DB = raw ? JSON.parse(raw) : blankDb();
  }catch(e){ DB = blankDb(); }
  if(!DB.schema || DB.schema < SCHEMA) DB = Object.assign(blankDb(), DB, {schema:SCHEMA});
  if(!DB.primes || !DB.primes.criteres) DB.primes = blankDb().primes;
  if(!DB.commerciaux || !DB.commerciaux.length) DB.commerciaux = blankDb().commerciaux;
  if(!DB.settings) DB.settings = {logo:null, logoDim:null, logoPrevLight:true};
  if(!DB.settings.rdvQualifie) DB.settings.rdvQualifie = {resultats:['Commande','Devis émis'], types:['Rendez-vous devis']};
  if(!DB.settings.rentabilite) DB.settings.rentabilite = {coutDefaut:5000, couts:{}, tauxMarge:null};
  completerCriteres();
  WHO = localStorage.getItem('gos_who') || DB.commerciaux[0].id;
  if(!DB.commerciaux.some(c=>c.id===WHO)) WHO = DB.commerciaux[0].id;
  migrateObjectifs();
  YEAR = localStorage.getItem('gos_year') || todayISO().slice(0,4);
}

/* Les objectifs annuels étaient stockés sans exercice : on les rattache à
   l'année en cours pour pouvoir comparer 2027 à 2026. */
function migrateObjectifs(){
  const a = DB.objectifs.annuel || {};
  Object.keys(a).forEach(com => {
    const v = a[com];
    if(v && typeof v === 'object' && ('ca' in v || 'marge' in v)){
      a[com] = { [todayISO().slice(0,4)]: {ca:+v.ca||0, marge:+v.marge||0} };
    }
  });
  DB.objectifs.annuel = a;
}

function setYear(y){ YEAR = y; localStorage.setItem('gos_year', y); render(); }

/* Exercices proposés : de la première donnée connue à l'année prochaine. */
function exercices(){
  const ys = new Set();
  const now = +todayISO().slice(0,4);
  ys.add(String(now)); ys.add(String(now+1)); ys.add(String(now-1));
  DB.visites.forEach(v => { if(v.date) ys.add(v.date.slice(0,4)); });
  DB.semaines.forEach(s => { const m = weekToMonth(s.week); if(m) ys.add(m.slice(0,4)); });
  DB.clients.forEach(c => { Object.keys(c.caByMonth||{}).forEach(m => ys.add(m.slice(0,4))); });
  Object.keys(DB.officiels||{}).forEach(m => ys.add(m.slice(0,4)));
  Object.values(DB.objectifs.annuel||{}).forEach(o => Object.keys(o||{}).forEach(y => ys.add(y)));
  return [...ys].filter(y=>/^\d{4}$/.test(y)).sort().reverse();
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(DB)); }
  catch(e){ toast("Stockage saturé — exportez une sauvegarde puis allégez les données.", 'bad'); }
  if(typeof gAuto === 'function') gAuto();
}
function setWho(id){ WHO = id; localStorage.setItem('gos_who', id); render(); }
function whoName(id){ const c = DB.commerciaux.find(x=>x.id===(id||WHO)); return c ? c.nom : '—'; }

/* ---------- utilitaires ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function normKey(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function commercialId(raw){
  const k = normKey(raw);
  if(!k) return DB.commerciaux[0].id;
  const hit = DB.commerciaux.find(c => normKey(c.nom) === k || c.id === k);
  if(hit) return hit.id;
  const id = k.replace(/ /g,'_');
  DB.commerciaux.push({id, nom:String(raw).trim(), actif:true});
  return id;
}
const eur = n => (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' €';
const eur2 = n => (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const pct = n => (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' %';
const num = n => (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:0});

function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return String(d||'').slice(0,7); }
function curMonth(){ return todayISO().slice(0,7); }
function curYear(){ return todayISO().slice(0,4); }
function monthLabel(mk){
  if(!mk) return '—';
  const [y,m] = mk.split('-');
  const noms = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return (noms[parseInt(m,10)-1]||m) + ' ' + y;
}
function fdate(d){
  if(!d) return '—';
  const x = new Date(d);
  return isNaN(x) ? d : x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function daysSince(d){
  if(!d) return null;
  const x = new Date(d); if(isNaN(x)) return null;
  return Math.floor((Date.now() - x.getTime())/86400000);
}
function isoWeek(d){
  const t = new Date(d); if(isNaN(t)) return '';
  const dt = new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()));
  const dn = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dn);
  const y0 = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  const wn = Math.ceil((((dt - y0)/86400000)+1)/7);
  return dt.getUTCFullYear() + '-W' + String(wn).padStart(2,'0');
}
function weekToMonth(w){
  if(!w || !w.includes('-W')) return '';
  const [y,ws] = w.split('-W');
  const d = new Date(Date.UTC(+y,0,1 + (parseInt(ws,10)-1)*7));
  const dn = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dn);
  return d.toISOString().slice(0,7);
}

/* ---------- accès clients ---------- */
/* Recherche stricte : un même nom chez deux commerciaux désigne deux comptes
   distincts. Les confondre ferait fusionner leurs chiffres, et le second import
   écraserait le premier. */
function findClient(nom, commercial){
  const k = normKey(nom);
  if(commercial) return DB.clients.find(c => c.nomKey === k && c.commercial === commercial) || null;
  return DB.clients.find(c => c.nomKey === k) || null;
}
/* Même nom, quel que soit le commercial — sert à prévenir l'utilisateur. */
function findClientAilleurs(nom, commercial){
  const k = normKey(nom);
  return DB.clients.find(c => c.nomKey === k && c.commercial !== commercial) || null;
}
/* Noms portés par plusieurs commerciaux : signalés à l'écran, pas fusionnés. */
function nomsPartages(){
  const par = new Map();
  DB.clients.forEach(c => {
    const s = par.get(c.nomKey) || new Set();
    s.add(c.commercial); par.set(c.nomKey, s);
  });
  return [...par.entries()].filter(([,s]) => s.size > 1).map(([k]) => k);
}
function ensureClient(nom, commercial, extra){
  if(!nom) return null;
  let c = findClient(nom, commercial);
  if(c){
    if(extra) Object.keys(extra).forEach(k => { if(extra[k] && !c[k]) c[k] = extra[k]; });
    return c;
  }
  c = Object.assign({
    id: uid(), nom: String(nom).trim(), nomKey: normKey(nom),
    commercial: commercial || WHO,
    reseau:'', dept:'', dateOuverture:'', caByMonth:{},
    contact:{nom:'',prenom:'',tel:'',email:''},
    createdAt: new Date().toISOString(), source:'saisie'
  }, extra || {});
  c.nomKey = normKey(c.nom);
  DB.clients.push(c);
  return c;
}
function clientById(id){ return DB.clients.find(c => c.id === id); }
function lastVisitOf(clientId){
  const vs = DB.visites.filter(v => v.clientId === clientId).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  return vs[0] || null;
}

const DEFAULT_LOGO_DIM = {w:480, h:82};

function logoData(){ return (DB.settings && DB.settings.logo) || DEFAULT_LOGO; }
function logoDim(){
  const d = DB.settings && DB.settings.logo && DB.settings.logoDim;
  return d || DEFAULT_LOGO_DIM;
}
function logoPersonnalise(){ return !!(DB.settings && DB.settings.logo); }

function renderBrand(){
  const b = document.getElementById('brand');
  const m = document.getElementById('brandMark');
  const lg = logoData();
  if(lg){ m.innerHTML = `<img src="${lg}" alt="GIVEDIS">`; b.classList.add('haslogo'); }
  else { m.innerHTML = MARK_SVG; b.classList.remove('haslogo'); }
}

function renderShell(){
  renderBrand();

  document.getElementById('spaces').innerHTML = Object.keys(NAV).map(k =>
    `<button class="space-btn ${k===SPACE?'on':''}" onclick="go('${k}')">${NAV[k].label}</button>`
  ).join('');

  document.getElementById('tabs').innerHTML = NAV[SPACE].tabs.map(t =>
    `<button class="tab ${t.id===TAB?'on':''}" onclick="go('${SPACE}','${t.id}')">${t.label}</button>`
  ).join('');

  document.getElementById('yearSel').innerHTML = exercices()
    .map(y => `<option value="${y}" ${y===YEAR?'selected':''}>${y}</option>`).join('');
}

function render(){
  VIS_CA_IDX = null;
  Object.values(CHARTS).forEach(c => { try{ c.destroy(); }catch(e){} });
  CHARTS = {};
  if(!NAV[SPACE]) SPACE = 'pilotage';
  if(!NAV[SPACE].tabs.some(t => t.id === TAB)) TAB = NAV[SPACE].tabs[0].id;
  renderShell();
  const fn = VIEWS[SPACE + ':' + TAB];
  document.getElementById('main').innerHTML =
    `<div class="view on">${fn ? fn() : '<div class="card"><div class="empty"><p>Écran introuvable.</p></div></div>'}</div>`;
  const after = AFTER[SPACE + ':' + TAB];
  if(after) setTimeout(after, 30);
}

const VIEWS = {};
const AFTER = {};

function emptyState(icon, text, btn){
  return `<div class="empty"><div class="big">${icon}</div><p>${text}</p>${btn||''}</div>`;
}

/* Référentiels partagés — affichage et lecture des imports. */
const TYPES_VISITE = ['Visite de suivi','Prospection','Formation produit','Litige / SAV','Chantier','Salon / événement','Rendez-vous devis'];
const RESULTATS = [
  {v:'Commande',   k:'ok'},
  {v:'Devis émis', k:'info'},
  {v:'À relancer', k:'warn'},
  {v:'Sans suite', k:'bad'},
  {v:'Information',k:'mute'}
];
const tagResultat = r => (RESULTATS.find(x=>x.v===r)||{k:'mute'}).k;

/* ==========================================================================
   Fiches clients — création manuelle et consultation
   ========================================================================== */
function addClientModal(){
  openModal(`
    <h3 style="margin-bottom:14px">Ajouter un client</h3>
    <p class="hint" style="margin-bottom:14px">La plupart des clients se créent tout seuls à l'import des visites. Cette fiche sert aux cas que l'import ne couvre pas.</p>
    <div class="field"><label class="f" for="mNom">Nom</label><input id="mNom" placeholder="Ex. SONEPAR Bourgoin"></div>
    <div class="grid g3">
      <div><label class="f" for="mReseau">Réseau</label>
        <select id="mReseau"><option value="">—</option><option>REXEL</option><option>SONEPAR</option><option>YESSS</option><option>Installateur</option><option>Autre</option></select></div>
      <div><label class="f" for="mDept">Département</label><input id="mDept" maxlength="3" placeholder="69"></div>
      <div><label class="f" for="mCom">Commercial</label>
        <select id="mCom">${DB.commerciaux.map(c=>`<option value="${c.id}" ${c.id===WHO?'selected':''}>${esc(c.nom)}</option>`).join('')}</select></div>
    </div>
    <div class="btnrow" style="margin-top:16px">
      <button class="btn" onclick="saveNewClient()">Ajouter</button>
      <button class="btn ghost" onclick="closeModal()">Annuler</button>
    </div>`);
}
function saveNewClient(){
  const nom = document.getElementById('mNom').value.trim();
  if(!nom){ toast('Nommez le client.', 'bad'); return; }
  const com = document.getElementById('mCom').value;
  if(findClient(nom, com)){ toast('Ce client existe déjà.', 'bad'); return; }
  ensureClient(nom, com, {
    reseau: document.getElementById('mReseau').value,
    dept: document.getElementById('mDept').value.trim(),
    dateOuverture: todayISO(), source:'manuel'
  });
  save(); closeModal(); toast('Client ajouté', 'ok'); render();
}

function clientModal(id){
  const c = clientById(id); if(!c) return;
  const vs = DB.visites.filter(v => v.clientId === id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const caY = Object.entries(c.caByMonth||{}).filter(([k])=>k.startsWith(YEAR)).reduce((s,[,v])=>s+v,0);
  openModal(`
    <div class="eyebrow">${esc(c.reseau||'Client')} · ${esc(whoName(c.commercial))}</div>
    <h3 style="font-size:23px">${esc(c.nom)}</h3>
    <div class="grid g3" style="margin:16px 0">
      <div class="kpi"><div class="lab">CA ${YEAR}</div><div class="val" style="font-size:24px">${eur(caY)}</div></div>
      <div class="kpi info"><div class="lab">Visites</div><div class="val" style="font-size:24px">${vs.length}</div></div>
      <div class="kpi ok"><div class="lab">Ouvert le</div><div class="val" style="font-size:19px">${c.dateOuverture?fdate(c.dateOuverture):'—'}</div></div>
    </div>
    ${c.contact&&(c.contact.nom||c.contact.tel)?`<div class="note">Contact : ${esc(c.contact.prenom||'')} ${esc(c.contact.nom||'')}${c.contact.tel?' · '+esc(c.contact.tel):''}${c.contact.email?' · '+esc(c.contact.email):''}</div>`:''}
    <h4 style="margin:18px 0 8px">Historique des visites</h4>
    ${vs.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Commercial</th><th>Type</th><th>Résultat</th><th>Compte rendu</th></tr></thead>
      <tbody>${vs.map(v=>`<tr><td class="mono">${fdate(v.date)}</td><td>${esc(whoName(v.commercial))}</td><td>${esc(v.type||'—')}</td>
      <td><span class="tag ${tagResultat(v.resultat)}">${esc(v.resultat)}</span></td>
      <td style="color:var(--ink2)">${esc(v.compteRendu||'—')}</td></tr>`).join('')}</tbody></table></div>`
    :`<p class="hint">Aucune visite importée pour ce client.</p>`}
    <div class="btnrow" style="margin-top:18px">
      <button class="btn ghost" onclick="closeModal()">Fermer</button>
      <button class="btn danger" onclick="delClient('${c.id}')">Supprimer le client</button>
    </div>`);
}
function delClient(id){
  if(!confirm('Supprimer ce client et toutes ses visites ?')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  DB.visites = DB.visites.filter(v=>v.clientId!==id);
  save(); closeModal(); toast('Client supprimé'); render();
}
function delVisite(id){
  if(!confirm('Supprimer cette visite ?')) return;
  DB.visites = DB.visites.filter(v => v.id !== id);
  save(); toast('Visite supprimée'); render();
}

/* ==========================================================================
   Relances & clients dormants — vue équipe
   ========================================================================== */
VIEWS['pilotage:relances'] = () => {
  const filtre = v => !FILTRE.com || v.commercial === FILTRE.com;
  const rel = DB.visites.filter(v => v.relance && filtre(v))
    .sort((a,b)=>(a.relanceDate||'9999').localeCompare(b.relanceDate||'9999'));
  const dormants = DB.clients.filter(c => !FILTRE.com || c.commercial === FILTRE.com).map(c=>{
    const lv = lastVisitOf(c.id); return {c, d: lv?daysSince(lv.date):null, lv};
  }).filter(x => x.d===null || x.d>60).sort((a,b)=>(b.d===null?99999:b.d)-(a.d===null?99999:a.d));
  const retard = rel.filter(v => v.relanceDate && daysSince(v.relanceDate) > 0).length;

  const selCom = `<select style="width:auto" onchange="FILTRE.com=this.value;render()">
      <option value="">Toute l'équipe</option>
      ${DB.commerciaux.map(c=>`<option value="${c.id}" ${FILTRE.com===c.id?'selected':''}>${esc(c.nom)}</option>`).join('')}
    </select>`;

  return `
  <div class="grid g3" style="margin-bottom:16px">
    <div class="kpi ${rel.length?'':'ok'}"><div class="lab">Relances ouvertes</div><div class="val">${rel.length}</div></div>
    <div class="kpi ${retard?'bad':'ok'}"><div class="lab">En retard</div><div class="val">${retard}</div><div class="sub">échéance dépassée</div></div>
    <div class="kpi ${dormants.length?'bad':'ok'}"><div class="lab">Clients dormants</div><div class="val">${dormants.length}</div><div class="sub">plus de 60 jours</div></div>
  </div>

  <div class="card">
    <div class="card-h"><h3>Relances à suivre</h3>${selCom}</div>
    <p class="hint" style="margin-bottom:12px">Alimenté par les visites importées dont le résultat est « À relancer ».</p>
    ${rel.length?`<div class="tw"><table><thead><tr><th>Échéance</th><th>Commercial</th><th>Client</th><th>Contexte</th><th></th></tr></thead>
      <tbody>${rel.map(v=>{
        const d = v.relanceDate ? daysSince(v.relanceDate) : null;
        const st = d===null?'mute':d>0?'bad':d>-3?'warn':'info';
        return `<tr><td class="mono">${v.relanceDate?fdate(v.relanceDate):'non datée'}<div style="margin-top:4px"><span class="tag ${st}">${d===null?'—':d>0?'retard '+d+' j':'dans '+(-d)+' j'}</span></div></td>
        <td>${esc(whoName(v.commercial))}</td>
        <td><strong>${esc(v.clientNom)}</strong><div class="hint">visite du ${fdate(v.date)}</div></td>
        <td style="color:var(--ink2);max-width:380px">${esc(v.compteRendu||'—')}</td>

/* ==========================================================================
   Moteur de calcul unifié — une seule source de vérité pour les 3 espaces
   ========================================================================== */
/* Un RDV qualifié n'est pas une donnée saisie : c'est une visite importée qui
   répond aux critères définis dans l'écran Saisie hebdo. */
function confRdv(){
  DB.settings = DB.settings || {};
  DB.settings.rdvQualifie = DB.settings.rdvQualifie || {resultats:['Commande','Devis émis'], types:['Rendez-vous devis']};
  return DB.settings.rdvQualifie;
}
function estRdvQualifie(v){
  const c = confRdv();
  return (c.resultats||[]).includes(v.resultat) || (c.types||[]).includes(v.type);
}
function rdvSemaine(com, week){
  return DB.visites.filter(v => v.commercial === com && isoWeek(v.date) === week && estRdvQualifie(v)).length;
}
/* Les semaines sont rattachées au mois de leur jeudi, comme le CA. */
function weeksOfMonth(mk){
  const y = +String(mk).slice(0,4);
  const out = [];
  for(let i=1;i<=53;i++){
    const w = y + '-W' + String(i).padStart(2,'0');
    if(weekToMonth(w) === mk) out.push(w);
  }
  return out;
}
function rdvMois(com, mk){
  return weeksOfMonth(mk).reduce((s, w) => {
    const rec = DB.semaines.find(x => x.commercial === com && x.week === w);
    const force = rec && rec.rdvForce != null && rec.rdvForce !== '' ? +rec.rdvForce : null;
    return s + (force != null ? force : rdvSemaine(com, w));
  }, 0);
}

function semainesOf(com, mk){
  return DB.semaines.filter(s => s.commercial === com && weekToMonth(s.week) === mk);
}
function officiel(com, mk){
  const o = DB.officiels[mk];
  return (o && o[com]) ? o[com] : null;
}
function stats(com, mk){
  const sem = semainesOf(com, mk);
  const off = officiel(com, mk);
  const caSaisi    = sem.reduce((s,x)=>s+(+x.ca||0),0);
  const margeSaisi = sem.reduce((s,x)=>s+(+x.marge||0),0);
  const ca    = off && off.ca    != null ? +off.ca    : caSaisi;
  const marge = off && off.marge != null ? +off.marge : margeSaisi;

  const vis = DB.visites.filter(v => v.commercial===com && monthKey(v.date)===mk);
  const commandes = vis.filter(v => v.resultat === 'Commande').length;
  const devis     = vis.filter(v => v.resultat === 'Devis émis').length;
  const nouveaux  = nouveauxDuMois(com, mk).length;

  return {
    mk, com, ca, marge, caSaisi, margeSaisi,
    officiel: !!off,
    txmarge: ca ? marge/ca*100 : 0,
    visites: vis.length, commandes, devis, nouveaux,
    rdv: rdvMois(com, mk),
    txtransfo: vis.length ? commandes/vis.length*100 : 0,
    semaines: sem.length
  };
}
function objMois(com, mk){
  const a = (DB.objectifs.annuel[com]||{})[String(mk).slice(0,4)];
  const douzieme = a ? {ca:(+a.ca||0)/12, marge:(+a.marge||0)/12} : {ca:0, marge:0};
  const m = (DB.objectifs.mensuel[com]||{})[mk];
  if(!m) return douzieme;
  /* L'objectif mensuel ne porte que le CA : la marge reste au douzième. */
  return {ca: +m.ca || 0, marge: m.marge != null ? +m.marge : douzieme.marge};
}
function objAn(com, y){ return (DB.objectifs.annuel[com]||{})[y||YEAR] || {ca:0,marge:0}; }

/* Cumul d'exercice jusqu'au mois m inclus (1-12) — pour comparer à périmètre égal. */
function ytd(com, y, m){
  let ca=0, marge=0, visites=0, nouveaux=0, commandes=0;
  for(let i=1;i<=m;i++){
    const s = stats(com, y + '-' + String(i).padStart(2,'0'));
    ca+=s.ca; marge+=s.marge; visites+=s.visites; nouveaux+=s.nouveaux; commandes+=s.commandes;
  }
  return {ca, marge, visites, nouveaux, commandes};
}
function evo(a, b){ return (b && b !== 0) ? (a-b)/b*100 : null; }
function evoTag(v, suffixe){
  if(v === null) return `<span class="tag mute">—</span>`;
  const k = v > 0.5 ? 'ok' : v < -0.5 ? 'bad' : 'mute';
  const signe = v > 0 ? '+' : '';
  return `<span class="tag ${k}">${signe}${v.toLocaleString('fr-FR',{maximumFractionDigits:1})} %${suffixe||''}</span>`;
}
/* Mois de référence du tableau de bord selon l'exercice consulté. */
function dashMonth(){
  return YEAR === todayISO().slice(0,4) ? curMonth() : YEAR + '-12';
}
function monthsOfYear(y){
  return Array.from({length:12},(_,i)=> y + '-' + String(i+1).padStart(2,'0'));
}
function lastMonths(n){
  const out = []; const d = new Date();
  for(let i=n-1;i>=0;i--){
    const x = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
const ACTIFS = () => DB.commerciaux.filter(c=>c.actif!==false);

/* Première commande d'un client : la plus ancienne visite chiffrée.
   À défaut de montant sur les visites, on retombe sur le CA du mois d'ouverture. */
function premiereCommande(c){
  if(c.premiereCommande != null && c.premiereCommande !== '')
    return {date: c.dateOuverture, montant: +c.premiereCommande, manuel: true};
  const vs = DB.visites.filter(v => v.clientId === c.id && (+v.ca||0) > 0)
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if(vs.length) return {date: vs[0].date, montant: +vs[0].ca};
  const mk = monthKey(c.dateOuverture);
  const v = (c.caByMonth||{})[mk];
  return v ? {date: c.dateOuverture, montant: +v} : null;
}
/* ---------- Règle « nouveau compte » ----------
   Un client compte comme nouveau compte le mois M s'il réalise plus de
   250 € de chiffre ce mois-là, sans aucun chiffre de janvier de la même
   année jusqu'au mois précédent (client jamais actif, ou client dormant
   qui n'a rien commandé depuis le début de l'année). */
function seuilNouveau(){
  const s = (DB.settings||{}).seuilNouveau;
  return s != null && s !== '' ? +s : 250;
}
/* Chiffre d'un client sur un mois : relevé comptable / saisie, à défaut les visites chiffrées. */
var VIS_CA_IDX = null; /* clientId|mois → CA des visites ; vidé à chaque rendu */
function caClientMois(c, m){
  const v = (c.caByMonth||{})[m];
  if(v != null && v !== '') return +v || 0;
  if(!VIS_CA_IDX){
    VIS_CA_IDX = {};
    DB.visites.forEach(x => { if(+x.ca){ const k = x.clientId + '|' + monthKey(x.date); VIS_CA_IDX[k] = (VIS_CA_IDX[k]||0) + (+x.ca); } });
  }
  return VIS_CA_IDX[c.id + '|' + m] || 0;
}
/* Mois (AAAA-MM) où le client devient nouveau compte sur l'exercice y, ou null. */
function moisNouveau(c, y){
  y = String(y);
  const lim = y === todayISO().slice(0,4) ? curMonth() : y + '-12';
  for(const m of monthsOfYear(y)){
    if(m > lim) break;
    const ca = caClientMois(c, m);
    if(ca > 0) return ca > seuilNouveau() ? m : null; /* premier chiffre de l'année : retenu ou écarté */
  }
  return null;
}
function nouveauxDuMois(com, mk){
  return DB.clients.filter(c => c.commercial === com && moisNouveau(c, String(mk).slice(0,4)) === mk);
}
/* Gros nouveaux clients (1re commande ≥ seuil, 800 € par défaut) retenus pour la prime.
   Il faut au moins 3 nouveaux comptes dans le mois : les 2 premiers servent de seuil
   et ne rapportent rien. On prend d'abord les clients sous le seuil pour ces 2 places,
   afin de garder les gros clients pour la prime ; s'il en manque, les plus petits des
   gros clients complètent le seuil. Moins de 3 nouveaux comptes → 0. */
function nvxPrimes(com, mk, seuil){
  const l = nouveauxDuMois(com, mk).map(c => ({c, ca: caClientMois(c, mk)}));
  const gros = l.filter(x => x.ca >= (+seuil||0)).sort((a,b) => a.ca - b.ca);
  const petits = l.length - gros.length;
  if(l.length < 3) return [];
  const pris = Math.max(0, 2 - petits); /* gros clients absorbés par le seuil */
  return gros.slice(pris).map(x => x.c);
}
function nvxAuDessus(com, mk, seuil){
  return nvxPrimes(com, mk, seuil).length;
}

/* ==========================================================================
   Rentabilité — marge dégagée par les clients cochés face au coût du commercial
   ========================================================================== */
function confRenta(){
  DB.settings = DB.settings || {};
  DB.settings.rentabilite = DB.settings.rentabilite || {coutDefaut:5000, couts:{}, tauxMarge:null};
  const r = DB.settings.rentabilite;
  r.couts = r.couts || {};
  return r;
}
function coutMensuel(com){
  const r = confRenta();
  return r.couts[com] != null && r.couts[com] !== '' ? +r.couts[com] : +r.coutDefaut || 0;
}
/* Sélection : explicite si l'utilisateur a coché ou décoché,
   sinon par défaut les clients ouverts sur l'exercice consulté. */
function estSelRenta(c){
  return c.rentaSel === undefined || c.rentaSel === null
    ? (c.dateOuverture||'').startsWith(YEAR)
    : !!c.rentaSel;
}
/* Taux de repli, quand aucun taux n'est saisi sur le client :
   la valeur imposée dans les réglages, sinon le taux constaté sur l'exercice. */
function tauxMargeRenta(com, y){
  const r = confRenta();
  if(r.tauxMarge != null && r.tauxMarge !== '') return +r.tauxMarge;
  let ca = 0, mg = 0;
  monthsOfYear(y).forEach(m => { const s = stats(com, m); ca += s.ca; mg += s.marge; });
  return ca > 0 ? mg/ca*100 : 0;
}

/* Taux retenu pour un client sur un mois donné, par ordre de priorité :
   1. taux saisi pour ce client et ce mois
   2. taux par défaut du client
   3. taux de repli ci-dessus */
function tauxClient(c, m, com, y){
  const mm = (c.margeByMonth||{})[m];
  if(mm != null && mm !== '') return +mm;
  if(c.margeDefaut != null && c.margeDefaut !== '') return +c.margeDefaut;
  return tauxMargeRenta(com || c.commercial, y || YEAR);
}
function origineTaux(c, m){
  const mm = (c.margeByMonth||{})[m];
  if(mm != null && mm !== '') return 'mois';
  if(c.margeDefaut != null && c.margeDefaut !== '') return 'client';
  return 'repli';
}
function moisEcoules(y){
  const now = todayISO().slice(0,4);
  if(y < now) return 12;
  if(y > now) return 0;
  return +todayISO().slice(5,7);
}
function caSelMois(com, m){
  return DB.clients.filter(c => c.commercial === com && estSelRenta(c))
    .reduce((s,c) => s + (+(c.caByMonth||{})[m] || 0), 0);
}
function renta(com, y){
  const ms = monthsOfYear(y);
  const nbMois = moisEcoules(y);
  const repli = tauxMargeRenta(com, y);
  const cout = coutMensuel(com);
  const clientsSel = DB.clients.filter(c => c.commercial === com && estSelRenta(c));
  /* La marge se calcule client par client : chacun peut avoir son propre taux. */
  const lignes = ms.map((m,i) => {
    let ca = 0, mg = 0;
    clientsSel.forEach(c => {
      const v = +(c.caByMonth||{})[m] || 0;
      if(!v) return;
      ca += v;
      mg += v * tauxClient(c, m, com, y) / 100;
    });
    const actif = i < nbMois;
    return {mois:m, ca, marge:mg, cout: actif ? cout : 0, resultat: (actif ? mg - cout : 0), actif};
  });
  let cum = 0, moisEquilibre = null;
  lignes.forEach(l => { cum += l.resultat; l.cumul = cum; if(moisEquilibre === null && cum >= 0 && l.actif) moisEquilibre = l.mois; });
  const ca = lignes.reduce((s,l)=>s+l.ca,0);
  const marge = lignes.reduce((s,l)=>s+l.marge,0);
  const coutTotal = cout * nbMois;
  /* Taux effectif : moyenne pondérée par le chiffre, pas moyenne des taux. */
  const taux = ca > 0 ? marge/ca*100 : repli;
  return {
    com, y, taux, repli, cout, nbMois, lignes, ca, marge, coutTotal,
    resultat: marge - coutTotal,
    ratio: coutTotal ? marge/coutTotal*100 : 0,
    caSeuil: taux > 0 ? coutTotal/(taux/100) : 0,
    clients: clientsSel, nbClients: clientsSel.length,
    moisEquilibre
  };
}

/* ---------- Moteur de primes ---------- */
function calcPrime(com, mk){
  const st = stats(com, mk);
  const obj = objMois(com, mk);
  const P = DB.primes;
  const valeur = (t, c) => {
    if(t === 'txobjectif') return obj.ca ? st.ca/obj.ca*100 : 0;
    if(t === 'nvxseuil')   return nvxAuDessus(com, mk, c.param);
    return ({
      ca:st.ca, marge:st.marge, txmarge:st.txmarge, nouveaux:st.nouveaux,
      visites:st.visites, rdv:st.rdv, txtransfo:st.txtransfo, commandes:st.commandes
    }[t] ?? 0);
  };

  let gateOk = true, gateVal = 0, gateSeuil = 0;
  if(P.gate && P.gate.actif){
    gateVal = obj.ca ? st.ca/obj.ca*100 : 0;
    gateSeuil = +P.gate.seuil || 0;
    gateOk = gateVal >= gateSeuil;
  }

  /* Une cible peut être figée dans la règle, ou suivre l'objectif du mois —
     auquel cas elle est propre à chaque commercial et à chaque mois. */
  const cibleDe = c => {
    if(c.cibleSource === 'objectifCA')    return +obj.ca || 0;
    if(c.cibleSource === 'objectifMarge') return +obj.marge || 0;
    return +c.cible || 0;
  };
  const lignes = P.criteres.filter(c=>c.actif!==false).map(c => {
    const v = valeur(c.type, c);
    const cible = cibleDe(c);
    const taux = cible ? v/cible : 0;
    /* 'auto' suit le réglage général ; un critère peut imposer son propre mode. */
    const mode = (c.mode && c.mode !== 'auto') ? c.mode : (P.proratisation ? 'prorata' : 'seuil');
    const brut = mode === 'prorata'
      ? Math.min(1, taux) * (+c.montant||0)
      : (taux >= 1 ? (+c.montant||0) : 0);
    return {...c, mode, valeur:v, cible, taux:taux*100,
            auto: c.cibleSource === 'objectifCA' || c.cibleSource === 'objectifMarge',
            sansObjectif: (c.cibleSource === 'objectifCA' || c.cibleSource === 'objectifMarge') && !cible,
            montant_du: gateOk ? Math.round(brut) : 0, brut: Math.round(brut)};
  });

  const total = lignes.reduce((s,l)=>s+l.montant_du,0);
  const potentiel = P.criteres.filter(c=>c.actif!==false).reduce((s,c)=>s+(+c.montant||0),0);
  return {st, obj, lignes, total, potentiel, gateOk, gateVal, gateSeuil, gateActif: !!(P.gate&&P.gate.actif)};
}
function fmtCrit(c, v){
  if(['ca','marge'].includes(c.type)) return eur(v);
  if(['txmarge','txtransfo','txobjectif'].includes(c.type)) return pct(v);
  return num(v);
}

/* Montant retenu pour un client sur un mois, selon la mesure affichée. */
function montantMois(c, m){
  const ca = +(c.caByMonth||{})[m] || 0;
  if(MESURE_CLIENTS === 'ca') return ca;
  return ca ? ca * tauxClient(c, m, c.commercial, YEAR) / 100 : 0;
}

function tableauMensuel(list){
  const ms = monthsOfYear(YEAR);
  const lignes = list.map(({c}) => {
    const par = ms.map(m => montantMois(c, m));
    return {c, par, total: par.reduce((s,v)=>s+v,0)};
  }).filter(l => l.total !== 0 || MESURE_CLIENTS === 'ca')
    .sort((a,b) => b.total - a.total);

  const totaux = ms.map((_,i) => lignes.reduce((s,l)=>s+l.par[i],0));
  const grand = totaux.reduce((s,v)=>s+v,0);
  const avecChiffre = lignes.filter(l => l.total !== 0).length;

  return `
    <div class="chiprow" style="margin-bottom:14px">
      <div class="chip ${MESURE_CLIENTS==='ca'?'on':''}" onclick="MESURE_CLIENTS='ca';render()">Chiffre d'affaires</div>
      <div class="chip ${MESURE_CLIENTS==='marge'?'on':''}" onclick="MESURE_CLIENTS='marge';render()">Marge</div>
      <span class="hint" style="align-self:center;margin-left:6px">${avecChiffre} client${avecChiffre>1?'s':''} avec du chiffre sur ${YEAR} · total ${eur(grand)}</span>
    </div>
    <div class="tw"><table>
      <thead><tr>
        <th class="fige" style="min-width:190px">Client</th>
        ${ms.map(m=>`<th class="num" style="min-width:76px">${monthLabel(m).split(' ')[0]}</th>`).join('')}
        <th class="num" style="min-width:92px">Total</th>
      </tr></thead>
      <tbody>${lignes.slice(0,300).map(l=>`<tr${l.total?'':' style="opacity:.4"'}>
        <td class="fige"><strong>${esc(l.c.nom)}</strong>
          <div class="hint">${esc(whoName(l.c.commercial))}${l.c.reseau?' · '+esc(l.c.reseau):''}</div></td>
        ${l.par.map((v,i)=>`<td class="num mono"${v?'':' style="color:var(--ink3)"'}
          title="${esc(l.c.nom)} · ${monthLabel(ms[i])}">${v?eur(v):'—'}</td>`).join('')}
        <td class="num mono" style="font-weight:600;color:var(--acc2)">${l.total?eur(l.total):'—'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr style="border-top:2px solid var(--line2)">
        <td class="fige" style="font-weight:600">Total ${MESURE_CLIENTS==='ca'?'CA':'marge'}</td>
        ${totaux.map(v=>`<td class="num mono" style="font-weight:600">${v?eur(v):'—'}</td>`).join('')}
        <td class="num mono" style="font-weight:700;color:var(--acc2)">${eur(grand)}</td>
      </tr></tfoot>
    </table></div>
    ${lignes.length>300?`<p class="hint" style="margin-top:10px">300 premières lignes affichées sur ${lignes.length}. Affinez les filtres ci-dessus pour réduire la liste.</p>`:''}
    ${MESURE_CLIENTS==='marge'?`<p class="hint" style="margin-top:10px">La marge est calculée avec le taux propre à chaque client et à chaque mois, celui de l'écran Rentabilité — issu des relevés de la comptabilité ou saisi à la main.</p>`:''}`;
}
function renderKeep(id){
  const v = document.getElementById(id).value;
  const pos = document.getElementById(id).selectionStart;
  render();
  const el = document.getElementById(id);
  if(el){ el.value = v; el.focus(); el.setSelectionRange(pos,pos); }
}

function saveObjAnnuels(){
  ACTIFS().forEach(c=>{
    const ca = parseFloat(document.getElementById('oa_ca_'+c.id).value)||0;
    const mg = parseFloat(document.getElementById('oa_mg_'+c.id).value)||0;
    DB.objectifs.annuel[c.id] = DB.objectifs.annuel[c.id] || {};
    DB.objectifs.annuel[c.id][YEAR] = {ca, marge:mg};
  });
  save(); toast('Objectifs ' + YEAR + ' enregistrés','ok'); render();
}
function copierObjectifs(){
  const src = String(+YEAR - 1);
  let n = 0;
  ACTIFS().forEach(c=>{
    const a = (DB.objectifs.annuel[c.id]||{})[src];
    if(!a) return;
    DB.objectifs.annuel[c.id] = DB.objectifs.annuel[c.id] || {};
    DB.objectifs.annuel[c.id][YEAR] = {ca:+a.ca||0, marge:+a.marge||0};
    n++;
  });
  if(!n){ toast('Aucun objectif ' + src + ' à reprendre.', 'bad'); return; }
  save(); toast('Objectifs ' + src + ' repris sur ' + YEAR, 'ok'); render();
}
function saveObjMensuels(){
  const y = YEAR;
  ACTIFS().forEach(c=>{
    DB.objectifs.mensuel[c.id] = DB.objectifs.mensuel[c.id] || {};
    monthsOfYear(y).forEach(m=>{
      const el = document.getElementById('om_'+c.id+'_'+m);
      const v = el ? parseFloat(el.value) : NaN;
      if(!isNaN(v) && v > 0) DB.objectifs.mensuel[c.id][m] = {ca:v};
      else delete DB.objectifs.mensuel[c.id][m];
    });
  });
  save(); toast('Objectifs mensuels enregistrés','ok'); render();
}

function saveSemaine(){
  const com = document.getElementById('sCom').value;
  const week = document.getElementById('sWeek').value;
  if(!week){ toast('Choisissez une semaine.','bad'); return; }
  const rec = {
    id: uid(), commercial: com, week,
    ca: parseFloat(document.getElementById('sCa').value)||0,
    marge: parseFloat(document.getElementById('sMarge').value)||0,
    nouveaux: parseInt(document.getElementById('sNvx').value)||0,
    rdvForce: (function(){
      const el = document.getElementById('sRdvForce');
      return el && el.value !== '' ? parseInt(el.value) : null;
    })(),
    source:'manuel', timestamp: Date.now()
  };
  const i = DB.semaines.findIndex(s => s.commercial===com && s.week===week && s.source!=='importe');
  if(i>=0){ rec.id = DB.semaines[i].id; DB.semaines[i] = rec; }
  else DB.semaines.push(rec);
  save(); toast('Semaine ' + week + ' enregistrée','ok'); render();
}
function delSemaine(id){ DB.semaines = DB.semaines.filter(s=>s.id!==id); save(); toast('Semaine supprimée'); render(); }

/* Encart RDV : recalculé à chaque changement de commercial ou de semaine. */
function majRdvAuto(){
  const box = document.getElementById('sRdvAuto');
  if(!box) return;
  const com = document.getElementById('sCom').value;
  const week = document.getElementById('sWeek').value;
  const rec = DB.semaines.find(s => s.commercial===com && s.week===week);
  const auto = week ? rdvSemaine(com, week) : 0;
  const force = rec && rec.rdvForce != null && rec.rdvForce !== '' ? rec.rdvForce : '';
  const detail = week ? DB.visites.filter(v => v.commercial===com && isoWeek(v.date)===week && estRdvQualifie(v)) : [];
  box.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="disp" style="font-size:28px">${auto}</span>
      <span class="tag ok">calculé</span>
    </div>
    <div class="hint" style="margin-top:4px">${detail.length ? detail.slice(0,3).map(v=>esc(v.clientNom)).join(', ') + (detail.length>3?' +'+(detail.length-3):'') : 'aucune visite qualifiante cette semaine'}</div>
    <div style="margin-top:8px">
      <label class="f" for="sRdvForce" style="font-size:10px">Forcer une valeur</label>
      <input type="number" id="sRdvForce" value="${force}" placeholder="laisser vide" style="padding:6px 9px">
    </div>`;
}

function saveConfRdv(){
  const c = confRdv();
  c.resultats = [...document.querySelectorAll('[data-res].on')].map(e=>e.dataset.res);
  c.types     = [...document.querySelectorAll('[data-typ].on')].map(e=>e.dataset.typ);
  if(!c.resultats.length && !c.types.length){
    toast('Sélectionnez au moins un résultat ou un type, sinon le compteur restera à zéro.', 'bad');
    return;
  }
  save(); toast('Règle enregistrée — historique recalculé', 'ok'); render();
}

function addNouveauClient(){
  const nom = document.getElementById('nNom').value.trim();
  const mois = document.getElementById('nMois').value;
  const com = document.getElementById('nCom').value;
  if(!nom){ toast('Nommez le client.', 'bad'); return; }
  if(!mois){ toast("Indiquez le mois d'ouverture.", 'bad'); return; }
  const ca = parseFloat(document.getElementById('nCa').value);

  let c = findClient(nom, com);
  if(c){
    if(!confirm(`${c.nom} existe déjà chez ${whoName(c.commercial)}. Mettre à jour son mois d'ouverture et son chiffre ?`)) return;
  } else {
    const autre = findClientAilleurs(nom, com);
    if(autre && !confirm(`${autre.nom} existe déjà chez ${whoName(autre.commercial)}. Créer une fiche distincte pour ${whoName(com)} ? Les deux resteront séparées.`)) return;
    c = ensureClient(nom, com, {source:'manuel'});
  }
  c.commercial = com;
  c.dateOuverture = mois + '-01';
  if(!isNaN(ca)){
    c.premiereCommande = ca;
    c.caByMonth[mois] = Math.max(+c.caByMonth[mois]||0, ca);
  }
  save();
  if(moisNouveau(c, mois.slice(0,4)) === mois) toast(c.nom + ' déclaré en ' + monthLabel(mois), 'ok');
  else toast(c.nom + ' enregistré, mais non retenu comme nouveau compte : il faut plus de ' + eur(seuilNouveau()) + ' de chiffre dans le mois et aucun chiffre depuis janvier.', 'bad');
  render();
}

function listeNouveaux(y){
  return DB.clients.filter(c => moisNouveau(c, y))
    .sort((a,b)=>moisNouveau(b, y).localeCompare(moisNouveau(a, y)));
}
function saveNouveaux(){
  const nvx = listeNouveaux(YEAR);
  let n = 0;
  nvx.forEach((c,i)=>{
    const com = document.getElementById('nc_com_'+i);
    const ca  = document.getElementById('nc_ca_'+i);
    if(!com || !ca) return;
    const mn = moisNouveau(c, YEAR);
    if(com.value !== c.commercial){ c.commercial = com.value; n++; }
    const v = ca.value === '' ? null : parseFloat(ca.value);
    if(v != null && !isNaN(v) && Math.abs(v - caClientMois(c, mn)) > 0.005){
      c.caByMonth = c.caByMonth || {};
      c.caByMonth[mn] = v; n++;
    }
  });
  save();
  toast(n ? n + ' modification' + (n>1?'s':'') + ' enregistrée' + (n>1?'s':'') : 'Aucune modification', n?'ok':null);
  render();
}

function savePrimeRules(){
  const P = DB.primes;
  P.gate.actif = document.getElementById('gActif').value === '1';
  P.gate.seuil = parseFloat(document.getElementById('gSeuil').value)||0;
  P.proratisation = document.getElementById('gProrata').value === '1';
  P.criteres = P.criteres.map((c,i)=>{
    const par = document.getElementById('cr_par_'+i);
    const cib = document.getElementById('cr_cib_'+i);
    const src = document.getElementById('cr_src_'+i);
    return {
      id: c.id || uid(),
      label: document.getElementById('cr_lab_'+i).value.trim() || 'Critère',
      type: document.getElementById('cr_typ_'+i).value,
      cibleSource: src ? src.value : (c.cibleSource||'fixe'),
      cible: cib ? (parseFloat(cib.value)||0) : (+c.cible||0),
      montant: parseFloat(document.getElementById('cr_mnt_'+i).value)||0,
      mode: document.getElementById('cr_mod_'+i).value,
      param: par ? (parseFloat(par.value)||0) : (+c.param||0),
      actif: document.getElementById('cr_act_'+i).value === '1'
    };
  });
  save(); toast('Règles de prime enregistrées','ok'); render();
}
function addCritere(){
  savePrimeRulesSilent();
  DB.primes.criteres.push({id:uid(),label:'Nouveau critère',type:'ca',cible:0,montant:0,actif:true,mode:'auto',param:0,cibleSource:'fixe'});
  save(); render();
}
function delCritere(i){
  savePrimeRulesSilent();
  DB.primes.criteres.splice(i,1); save(); render();
}
function savePrimeRulesSilent(){
  try{
    DB.primes.criteres = DB.primes.criteres.map((c,i)=>{
      const lab = document.getElementById('cr_lab_'+i); if(!lab) return c;
      const par = document.getElementById('cr_par_'+i);
      const cib = document.getElementById('cr_cib_'+i);
      const src = document.getElementById('cr_src_'+i);
      return {...c,
        label: lab.value.trim()||c.label,
        type: document.getElementById('cr_typ_'+i).value,
        cibleSource: src ? src.value : (c.cibleSource||'fixe'),
        cible: cib ? (parseFloat(cib.value)||0) : (+c.cible||0),
        montant: parseFloat(document.getElementById('cr_mnt_'+i).value)||0,
        mode: document.getElementById('cr_mod_'+i).value,
        param: par ? (parseFloat(par.value)||0) : (+c.param||0),
        actif: document.getElementById('cr_act_'+i).value === '1'};
    });
  }catch(e){}
}

function rentaToggle(id, val){
  const c = clientById(id); if(!c) return;
  c.rentaSel = !!val;
  save(); render();
}
function rentaTout(val){
  DB.clients.filter(c => c.commercial === RENTA_COM).forEach(c => { c.rentaSel = val; });
  save(); toast(val?'Tous les clients cochés':'Tous les clients décochés'); render();
}
function rentaDefaut(){
  DB.clients.filter(c => c.commercial === RENTA_COM).forEach(c => { delete c.rentaSel; });
  save(); toast('Sélection ramenée aux ouvertures de ' + YEAR, 'ok'); render();
}
function saveTauxMarge(){
  const coches = DB.clients.filter(c => c.commercial === RENTA_COM && estSelRenta(c))
    .sort((a,b)=>a.nom.localeCompare(b.nom));
  let n = 0;
  coches.forEach((c,i) => {
    const def = document.getElementById('tm_def_'+i);
    if(def){
      const v = def.value === '' ? null : parseFloat(def.value);
      const avant = c.margeDefaut == null ? null : +c.margeDefaut;
      if(v !== avant){ c.margeDefaut = v; n++; }
    }
    c.margeByMonth = c.margeByMonth || {};
    monthsOfYear(YEAR).forEach(m => {
      const el = document.getElementById('tm_'+i+'_'+m);
      if(!el) return;
      const avant = c.margeByMonth[m];
      if(el.value === ''){ if(avant !== undefined){ delete c.margeByMonth[m]; n++; } }
      else {
        const v = parseFloat(el.value);
        if(!isNaN(v) && v !== avant){ c.margeByMonth[m] = v; n++; }
      }
    });
  });
  save();
  toast(n ? n + ' taux mis à jour' : 'Aucune modification', n ? 'ok' : null);
  render();
}

function saveRenta(){
  const r = confRenta();
  r.coutDefaut = parseFloat(document.getElementById('reCout').value) || 0;
  const t = document.getElementById('reTaux').value;
  r.tauxMarge = t === '' ? null : parseFloat(t);
  ACTIFS().forEach(c => {
    const el = document.getElementById('re_' + c.id);
    if(!el) return;
    if(el.value === '') delete r.couts[c.id];
    else r.couts[c.id] = parseFloat(el.value) || 0;
  });
  save(); toast('Réglages enregistrés', 'ok'); render();
}

const LEGACY = [
  {key:'clients',           app:'CRM GIVEDIS',    quoi:'Portefeuille clients'},
  {key:'weeklyEntries',     app:'CRM GIVEDIS',    quoi:'Saisies hebdomadaires'},
  {key:'rdvs',              app:'CRM GIVEDIS',    quoi:'Rendez-vous'},
  {key:'annualObjectives',  app:'CRM GIVEDIS',    quoi:'Objectifs annuels'},
  {key:'monthlyObjectives', app:'CRM GIVEDIS',    quoi:'Objectifs mensuels'},
  {key:'manualMarges',      app:'CRM GIVEDIS',    quoi:'Marges saisies'},
  {key:'gv_terrain_visites',app:'Suivi Visites',  quoi:'Visites terrain'},
  {key:'gv_portfolio',      app:'Suivi Visites',  quoi:'Portefeuilles commerciaux'},
  {key:'gv_control_store',  app:'Suivi Visites',  quoi:'Base contrôle manager'}
];
function readLegacy(k){
  try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
function legacyCount(v){
  if(v == null) return 0;
  if(Array.isArray(v)) return v.length;
  if(typeof v === 'object') return Object.keys(v).length;
  return 1;
}

function runImport(){
  let nC=0, nV=0, nS=0, nR=0;

  /* --- CRM : clients --- */
  const crmClients = readLegacy('clients');
  if(Array.isArray(crmClients)) crmClients.forEach(c => {
    if(!c || !c.nom) return;
    const com = commercialId(c.commercial || 'Clément');
    const ex = findClient(c.nom, com);
    if(ex){
      if(c.caByMonth) Object.entries(c.caByMonth).forEach(([m,v])=>{ if(!ex.caByMonth[m]) ex.caByMonth[m] = +v||0; });
      if(c.dateOuverture && !ex.dateOuverture) ex.dateOuverture = c.dateOuverture;
    } else {
      ensureClient(c.nom, com, {dateOuverture:c.dateOuverture||'', caByMonth:c.caByMonth||{}, source:'crm'});
      nC++;
    }
  });

  /* --- Suivi Visites : portefeuilles --- */
  const pf = readLegacy('gv_portfolio');
  if(pf && typeof pf === 'object') Object.entries(pf).forEach(([com, arr]) => {
    const id = commercialId(com);
    (arr||[]).forEach(x => {
      const nom = typeof x === 'string' ? x : (x && x.client);
      if(nom && !findClient(nom, id)){ ensureClient(nom, id, {source:'visites'}); nC++; }
    });
  });

  /* --- Suivi Visites : visites terrain --- */
  const vis = readLegacy('gv_terrain_visites');
  if(Array.isArray(vis)) vis.forEach(v => {
    if(!v || !v.client) return;
    const com = commercialId(v.commercial || 'Clément');
    const cl = ensureClient(v.client, com, {source:'visites'});
    const dup = DB.visites.some(x => x.clientId===cl.id && x.date===v.date && x.commercial===com && (x.compteRendu||'')===(v.compteRendu||''));
    if(dup) return;
    DB.visites.push({
      id: v.id || uid(), clientId: cl.id, clientNom: cl.nom, commercial: com,
      date: v.date || '', type: v.type || '', resultat: v.resultat || 'Information', ca: 0,
      relance: !!v.relance, relanceDate: v.relanceDate || null,
      compteRendu: v.compteRendu || '',
      contact: {nom:v.contactNom||'', prenom:v.contactPrenom||'', tel:v.contactTel||'', email:v.contactEmail||''},
      createdAt: v.createdAt || new Date().toISOString(), source:'visites'
    });
    nV++;
  });

  /* --- Suivi Visites : base contrôle --- */
  const ctrl = readLegacy('gv_control_store');
  if(ctrl && typeof ctrl === 'object') Object.values(ctrl).forEach(arr => {
    if(!Array.isArray(arr)) return;
    arr.forEach(v => {
      if(!v || !v.client) return;
      const com = commercialId(v.commercial || 'Clément');
      const cl = ensureClient(v.client, com, {source:'visites'});
      const dup = DB.visites.some(x => x.clientId===cl.id && x.date===v.date && (x.compteRendu||'')===(v.compteRendu||''));
      if(dup) return;
      DB.visites.push({id:v.id||uid(), clientId:cl.id, clientNom:cl.nom, commercial:com,
        date:v.date||'', type:v.type||'', resultat:v.resultat||'Information', ca:0,
        relance:!!v.relance, relanceDate:v.relanceDate||null, compteRendu:v.compteRendu||'',
        contact:{nom:'',prenom:'',tel:'',email:''}, createdAt:v.createdAt||new Date().toISOString(), source:'visites'});
      nV++;
    });
  });

  /* --- CRM : semaines --- */
  const we = readLegacy('weeklyEntries');
  if(Array.isArray(we)) we.forEach(e => {
    if(!e || !e.week) return;
    const com = commercialId(e.commercial || 'Clément');
    if(DB.semaines.some(s => s.commercial===com && s.week===e.week)) return;
    DB.semaines.push({id:uid(), commercial:com, week:e.week, ca:+e.ca||0, marge:+e.marge||0,
      rdv:+e.rdv||0, nouveaux:+e.clients||0, source: e.imported?'importe':'manuel', timestamp:e.timestamp||Date.now()});
    nS++;
  });

  /* --- CRM : RDV --- */
  const rd = readLegacy('rdvs');
  if(Array.isArray(rd)) rd.forEach(r => {
    if(!r) return;
    const com = commercialId(r.commercial || 'Clément');
    const date = r.date || r.dateRdv || '';
    if(!date || DB.rdvs.some(x=>x.date===date && x.client===(r.client||''))) return;
    DB.rdvs.push({id:r.id||uid(), date, commercial:com, client:r.client||'', objet:r.objet||r.sujet||''});
    nR++;
  });

  /* --- CRM : objectifs --- */
  const ao = readLegacy('annualObjectives');
  const yImport = todayISO().slice(0,4);
  if(ao && typeof ao === 'object') Object.entries(ao).forEach(([k,v])=>{
    const id = commercialId(k);
    DB.objectifs.annuel[id] = DB.objectifs.annuel[id] || {};
    if(/^\d{4}$/.test(k)) return;
    DB.objectifs.annuel[id][yImport] = (typeof v === 'object')
      ? {ca:+v.ca||0, marge:+v.marge||0}
      : {ca:+v||0, marge:0};
  });
  const mo = readLegacy('monthlyObjectives');
  if(mo && typeof mo === 'object') Object.entries(mo).forEach(([k,v])=>{
    if(typeof v !== 'object') return;
    const id = commercialId(k);
    DB.objectifs.mensuel[id] = DB.objectifs.mensuel[id] || {};
    Object.entries(v).forEach(([m,x])=>{ DB.objectifs.mensuel[id][m] = {ca: typeof x==='object' ? (+x.ca||0) : (+x||0)}; });
  });

  /* --- Cohérence : date d'ouverture depuis la première visite --- */
  DB.clients.forEach(c => {
    if(!c.dateOuverture){
      const vs = DB.visites.filter(v=>v.clientId===c.id).map(v=>v.date).filter(Boolean).sort();
      if(vs.length) c.dateOuverture = vs[0];
    }
  });

  DB.meta.lastImport = new Date().toISOString();
  save();
  toast(`Import terminé : ${nC} clients, ${nV} visites, ${nS} semaines, ${nR} RDV`, 'ok');
  render();
}

function importPastedJson(){
  const raw = document.getElementById('jsonPaste').value.trim();
  if(!raw){ toast("Collez d'abord le JSON.", 'bad'); return; }
  let d; try{ d = JSON.parse(raw); }catch(e){ toast('JSON illisible : ' + e.message, 'bad'); return; }
  const b = ingestJson(d);
  const r = bilanJson(b);
  if(!r){ toast('Aucune donnée exploitable dans ce JSON.', 'bad'); return; }
  toast('Importé : ' + r, 'ok'); render();
}

/* ==========================================================================
   Ingestion JSON — accepte trois formes :
   - un tableau de visites brut (export Terrain du Suivi Visites)
   - un objet { visites: [...] } eventuellement accompagne de clients/semaines
   - une sauvegarde GIVEDIS OS complete (fusion, sans ecraser l'existant)
   ========================================================================== */
function mapCommerciaux(src){
  /* Relie les identifiants du fichier source aux commerciaux locaux, par nom. */
  const m = {};
  (src && src.commerciaux || []).forEach(c => { if(c && c.id) m[c.id] = commercialId(c.nom || c.id); });
  return m;
}
function resoudreCom(val, table){
  if(val && table && table[val]) return table[val];
  return commercialId(val || 'Clément');
}

function ingestVisites(arr, table, clientsSrc){
  let n = 0, ignorees = 0;
  (arr||[]).forEach(v => {
    if(!v) return;
    let nom = v.clientNom || v.client || v.nom || '';
    if(!nom && v.clientId && Array.isArray(clientsSrc)){
      const c = clientsSrc.find(x => x.id === v.clientId);
      if(c) nom = c.nom;
    }
    const date = v.date || '';
    if(!nom || !date){ ignorees++; return; }

    const com = resoudreCom(v.commercial || v.vendeur, table);
    const cl = ensureClient(nom, com, {source:'json'});
    const cr = v.compteRendu || v.cr || v.commentaire || '';
    const resultat = v.resultat || v.result || 'Information';

    const dejaLa = DB.visites.some(x =>
      x.clientId === cl.id && x.date === date &&
      (x.compteRendu||'') === cr && (x.resultat||'') === resultat);
    if(dejaLa){ ignorees++; return; }

    const ct = v.contact || {};
    DB.visites.push({
      id: uid(), clientId: cl.id, clientNom: cl.nom, commercial: com, date,
      type: v.type || '', resultat, ca: +(v.ca || v.montant || 0) || 0,
      relance: !!v.relance || resultat === 'À relancer',
      relanceDate: v.relanceDate || null, compteRendu: cr,
      contact: {
        nom: ct.nom || v.contactNom || '', prenom: ct.prenom || v.contactPrenom || '',
        tel: ct.tel || v.contactTel || '', email: ct.email || v.contactEmail || ''
      },
      createdAt: v.createdAt || new Date().toISOString(), source:'json'
    });
    if(+v.ca > 0){ const mk = monthKey(date); cl.caByMonth[mk] = (cl.caByMonth[mk]||0) + (+v.ca||0); }
    n++;
  });
  return {n, ignorees};
}

function ingestJson(d){
  const b = {clients:0, visites:0, ignorees:0, semaines:0, rdvs:0, regles:0};
  if(!d) return b;

  const table = mapCommerciaux(d);
  const clientsSrc = Array.isArray(d.clients) ? d.clients : null;

  /* clients */
  if(clientsSrc) clientsSrc.forEach(c => {
    if(!c || !c.nom) return;
    const com = resoudreCom(c.commercial, table);
    const ex = findClient(c.nom, com);
    if(ex){
      Object.entries(c.caByMonth||{}).forEach(([m,v])=>{ if(!ex.caByMonth[m]) ex.caByMonth[m] = +v||0; });
      if(c.dateOuverture && !ex.dateOuverture) ex.dateOuverture = c.dateOuverture;
      if(c.reseau && !ex.reseau) ex.reseau = c.reseau;
      if(c.dept && !ex.dept) ex.dept = c.dept;
      if(c.contact && c.contact.nom && !(ex.contact&&ex.contact.nom)) ex.contact = c.contact;
      if(c.premiereCommande != null && ex.premiereCommande == null) ex.premiereCommande = +c.premiereCommande;
      if(c.margeDefaut != null && ex.margeDefaut == null) ex.margeDefaut = +c.margeDefaut;
      if(c.margeByMonth){ ex.margeByMonth = ex.margeByMonth || {};
        Object.entries(c.margeByMonth).forEach(([m,v])=>{ if(ex.margeByMonth[m] === undefined) ex.margeByMonth[m] = +v; }); }
    } else {
      ensureClient(c.nom, com, {reseau:c.reseau||'', dept:c.dept||'', dateOuverture:c.dateOuverture||'',
        caByMonth:c.caByMonth||{}, contact:c.contact||{nom:'',prenom:'',tel:'',email:''},
        premiereCommande: c.premiereCommande != null ? +c.premiereCommande : null,
        margeDefaut: c.margeDefaut != null ? +c.margeDefaut : null,
        margeByMonth: c.margeByMonth || {}, source:'json'});
      b.clients++;
    }
  });

  /* visites : tableau nu, ou champ visites/visits/terrain */
  const vis = Array.isArray(d) ? d : (d.visites || d.visits || d.terrain || d.gv_terrain_visites);
  if(Array.isArray(vis)){
    const r = ingestVisites(vis, table, clientsSrc);
    b.visites = r.n; b.ignorees = r.ignorees;
  }

  /* semaines */
  const sem = d.semaines || d.weeklyEntries || d.saisies;
  if(Array.isArray(sem)) sem.forEach(e => {
    const week = e.week || e.semaine; if(!week) return;
    const com = resoudreCom(e.commercial || e.vendeur, table);
    if(DB.semaines.some(s => s.commercial===com && s.week===week)) return;
    DB.semaines.push({id:uid(), commercial:com, week, ca:+(e.ca||e.chiffre||0)||0, marge:+(e.marge||0)||0,
      rdv:+(e.rdv||0)||0, nouveaux:+(e.nouveaux||e.clients||e.nouveauxClients||0)||0,
      source:'importe', timestamp:e.timestamp||Date.now()});
    b.semaines++;
  });

  /* rendez-vous */
  if(Array.isArray(d.rdvs)) d.rdvs.forEach(r => {
    const date = r.date || r.dateRdv || ''; if(!date) return;
    if(DB.rdvs.some(x=>x.date===date && x.client===(r.client||''))) return;
    DB.rdvs.push({id:uid(), date, commercial:resoudreCom(r.commercial, table),
      client:r.client||'', objet:r.objet||r.sujet||''});
    b.rdvs++;
  });

  /* regles de prime */
  const crit = d.criteres || (d.primes && d.primes.criteres);
  if(Array.isArray(crit) && crit.length){
    DB.primes.criteres = crit.map(c=>({id:c.id||uid(), label:c.label||c.nom||'Critère', type:c.type||'ca',
      cible:+c.cible||+c.objectif||0, montant:+c.montant||+c.prime||0, actif:c.actif!==false,
      mode:c.mode||'auto', param:+c.param||0, cibleSource:c.cibleSource||'fixe'}));
    if(d.primes && d.primes.gate) DB.primes.gate = d.primes.gate;
    b.regles = crit.length;
  }

  /* dates d'ouverture deduites de la premiere visite */
  DB.clients.forEach(c => {
    if(!c.dateOuverture){
      const ds = DB.visites.filter(v=>v.clientId===c.id).map(v=>v.date).filter(Boolean).sort();
      if(ds.length) c.dateOuverture = ds[0];
    }
  });

  save();
  return b;
}

function bilanJson(b){
  const p = [];
  if(b.clients)  p.push(b.clients + ' client' + (b.clients>1?'s':''));
  if(b.visites)  p.push(b.visites + ' visite' + (b.visites>1?'s':''));
  if(b.semaines) p.push(b.semaines + ' semaine' + (b.semaines>1?'s':''));
  if(b.rdvs)     p.push(b.rdvs + ' RDV');
  if(b.regles)   p.push(b.regles + ' critères de prime');
  return p.length ? p.join(', ') : null;
}

function importJsonFile(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    let d;
    try{ d = JSON.parse(e.target.result); }
    catch(err){
      document.getElementById('resJson').innerHTML = `<div class="note warn">JSON illisible : ${esc(err.message)}. Vérifiez que le fichier n'a pas été tronqué à la copie.</div>`;
      return;
    }
    const b = ingestJson(d);
    const bil = bilanJson(b);
    document.getElementById('resJson').innerHTML = bil
      ? `<div class="note ok">Importé : ${bil}.${b.ignorees?` ${b.ignorees} ligne${b.ignorees>1?'s':''} ignorée${b.ignorees>1?'s':''} — déjà présentes ou sans client ni date.`:''}</div>`
      : `<div class="note warn">Aucune donnée exploitable. Le fichier doit contenir des visites, des clients ou des semaines.</div>`;
    if(bil){ toast('Importé : ' + bil, 'ok'); }
    input.value = '';
  };
  r.onerror = () => toast('Lecture du fichier impossible.', 'bad');

function importXlsx(input){
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let n = 0;
      const cols = rows.length ? Object.keys(rows[0]) : [];
      const comCols = cols.filter(c => DB.commerciaux.some(x => normKey(x.nom) === normKey(c)) || ['clement','lorris'].includes(normKey(c)));
      rows.forEach(row => {

            const com = commercialId(cc);
            if(!findClient(nom, com)){ ensureClient(nom, com, {reseau:row.reseau||row.RESEAU||'', dept:String(row.dept||row.DEPT||''), dateOuverture:row.ouverture||'', source:'xlsx'}); n++; }
          });

          const com = commercialId(row.commercial||row.COMMERCIAL||'Clément');
          if(!findClient(nom, com)){ ensureClient(nom, com, {reseau:row.reseau||'', dept:String(row.dept||''), dateOuverture:row.ouverture||'', source:'xlsx'}); n++; }

function importCsv(input){
  const file = input.files[0]; if(!file) return;
  Papa.parse(file, {header:true, skipEmptyLines:true, complete: res => {
    let n = 0;
    res.data.forEach(row => {
      const nom = (row.client||row.CLIENT||'').trim(); if(!nom) return;
      const com = commercialId(row.commercial||'Clément');
      const cl = ensureClient(nom, com, {source:'csv'});
      const date = row.date||'';
      if(DB.visites.some(v=>v.clientId===cl.id && v.date===date)) return;
      DB.visites.push({id:uid(), clientId:cl.id, clientNom:cl.nom, commercial:com, date,
        type:row.type||'', resultat:row.resultat||'Information', ca:+row.ca||0,
        relance:false, relanceDate:null, compteRendu:row.compteRendu||row.cr||'',
        contact:{nom:'',prenom:'',tel:'',email:''}, createdAt:new Date().toISOString(), source:'csv'});

    });

    toast(n + ' visites importées', 'ok');

}

function dl(content, name, type){
  const b = new Blob([content], {type: type||'text/plain;charset=utf-8'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 1500);
}
function toCSV(rows){
  return '\uFEFF' + rows.map(r => r.map(c => {
    const s = String(c==null?'':c);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(';')).join('\n');
}

function pdfHead(doc, titre, sous){

      const hmm = 9, wmm = Math.min(46, hmm * (dim.w / Math.max(1,dim.h)));

      doc.setFillColor(255,255,255);
      doc.roundedRect(13, 7.5, wmm + 6, hmm + 5, 1.6, 1.6, 'F');

}

  return monthsOfYear(y).filter(m => m < cur);
}
