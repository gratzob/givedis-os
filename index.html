/* ==========================================================================
   Import des relevés mensuels de la comptabilité
   Un classeur par commercial et par mois : colonne client, colonne total HT.
   ========================================================================== */
const MOIS_FR = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
let COMPTA = [];

function detecteCommercial(nomFichier){
  const n = normKey(nomFichier);
  const hit = DB.commerciaux.find(c => n.includes(normKey(c.nom)));
  return hit ? hit.id : null;
}
function detecteMois(nomFichier){
  const n = normKey(nomFichier);
  const i = MOIS_FR.findIndex(m => n.includes(m));
  if(i < 0) return null;
  const an = (n.match(/20\d\d/) || [])[0] || (i + 1 > +todayISO().slice(5,7) ? String(+todayISO().slice(0,4) - 1) : todayISO().slice(0,4));
  return an + '-' + String(i + 1).padStart(2, '0');
}

/* Lit le classeur : on privilégie la feuille consolidée, on additionne les
   doublons de nom, et on met de côté la ligne « Total général » pour la
   rapprocher de la somme calculée. */
function lireClasseurCompta(wb){
  let ws = null;
  for(const nom of wb.SheetNames){
    const t = XLSX.utils.sheet_to_json(wb.Sheets[nom], {header:1, blankrows:false});
    const entete = Array.from(t[0] || [], x => normKey(x)).join(' ');
    if(entete.includes('client')){ ws = t; break; }
  }
  if(!ws) ws = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:false});

  const agg = new Map();
  let total = null, ignorees = 0;
  ws.slice(1).forEach(r => {
    const nom = (r[0] == null ? '' : String(r[0])).trim();
    const val = typeof r[1] === 'number' ? r[1] : parseFloat(String(r[1] || '').replace(/\s/g,'').replace(',','.'));
    if(!nom || isNaN(val)){ if(nom) ignorees++; return; }
    if(/total/i.test(nom)){ total = val; return; }
    const k = normKey(nom);
    const e = agg.get(k);
    if(e) e.montant += val;
    else agg.set(k, {nom, montant: val});
  });
  const lignes = [...agg.values()];
  const somme = lignes.reduce((s,l) => s + l.montant, 0);
  return {lignes, total, somme, ignorees, ecart: total == null ? null : somme - total};
}

/* Récapitulatif annuel : feuille de détail ligne à ligne, avec date, client,
   CA et achat. On agrège par client et par mois, et on calcule une marge
   pondérée par le chiffre — pas une moyenne des taux, qui serait fausse. */
function lireRecapMarge(wb){
  let t = null;
  for(const nom of wb.SheetNames){
    /* Valeurs brutes : combiné à cellDates, les dates arrivent en objets Date.
       En texte, Excel les rendrait au format américain, illisible ici. */
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[nom], {header:1, blankrows:false});
    /* Array.from plutôt que map : les en-têtes Excel peuvent être creux,
       et map laisserait des trous que findIndex lirait comme indéfinis. */
    const e = Array.from(rows[0] || [], x => normKey(x));
    const iD = e.findIndex(h => h && h.includes('date'));
    const iN = e.findIndex(h => h && (h === 'nom' || h.includes('client')));
    const iC = e.findIndex(h => h && h.includes('total ht'));
    const iA = e.findIndex(h => h && h.includes('achat'));
    if(iD >= 0 && iN >= 0 && iC >= 0 && iA >= 0){ t = {rows, iD, iN, iC, iA}; break; }
  }
  if(!t) return null;

  const nb = v => {
    if(typeof v === 'number') return v;
    const x = parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));
    return isNaN(x) ? 0 : x;
  };
  const mois = v => {
    if(v instanceof Date && !isNaN(v))
      return v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0');
    if(typeof v === 'number' && v > 20000 && v < 60000){   /* numéro de série Excel */
      const d = new Date(Date.UTC(1899,11,30) + v*86400000);
      if(!isNaN(d)) return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0');
    }
    const s = String(v == null ? '' : v).trim();
    let m = s.match(/^(\d{4})[-\/](\d{1,2})/);
    if(m) return m[1] + '-' + String(m[2]).padStart(2,'0');
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);
    if(m){
      let [, a, b, an] = m;
      an = an.length === 2 ? '20' + an : an;
      /* Jour et mois sont départagés dès que l'un dépasse 12 ; sinon on
         retient le format français, celui des fichiers de la comptabilité. */
      const jourDabord = +a > 12 ? true : (+b > 12 ? false : true);
      const mm = jourDabord ? b : a;
      return an + '-' + String(mm).padStart(2,'0');
    }
    return null;
  };

  const agg = new Map();
  let lues = 0, ignorees = 0;
  t.rows.slice(1).forEach(r => {
    const nom = String(r[t.iN] == null ? '' : r[t.iN]).trim();
    const mk = mois(r[t.iD]);
    if(!nom || !mk){ if(nom || r[t.iD]) ignorees++; return; }
    const k = mk + '|' + normKey(nom);
    const e = agg.get(k) || {mois:mk, nom, ca:0, achat:0};
    e.ca += nb(r[t.iC]); e.achat += nb(r[t.iA]);
    agg.set(k, e); lues++;
  });
  if(!agg.size) return null;

  const parMois = new Map();
  [...agg.values()].forEach(e => {
    const p = parMois.get(e.mois) || {mois:e.mois, lignes:[], ca:0, achat:0};
    p.lignes.push(e); p.ca += e.ca; p.achat += e.achat;
    parMois.set(e.mois, p);
  });
  const periodes = [...parMois.values()].sort((a,b)=>a.mois.localeCompare(b.mois));
  periodes.forEach(p => { p.taux = p.ca > 0 ? (p.ca - p.achat)/p.ca*100 : null; });
  const ca = periodes.reduce((s,p)=>s+p.ca,0), achat = periodes.reduce((s,p)=>s+p.achat,0);
  return {
    type:'recap', periodes, lignes:[...agg.values()], lues, ignorees,
    ca, achat, somme:ca, total:ca, ecart:0,
    taux: ca > 0 ? (ca-achat)/ca*100 : null,
    clients: new Set([...agg.values()].map(e=>normKey(e.nom))).size
  };
}

function analyserClasseur(wb){
  const recap = lireRecapMarge(wb);
  if(recap) return recap;
  return {type:'mensuel', ...lireClasseurCompta(wb)};
}

function chargerCompta(input){
  const files = [...input.files];
  if(!files.length) return;
  let restants = files.length;
  files.forEach(file => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
        const lu = analyserClasseur(wb);
        COMPTA.push({
          fichier: file.name,
          commercial: detecteCommercial(file.name) || (ACTIFS()[0] || {}).id,
          mois: detecteMois(file.name) || curMonth(),
          detecteCom: !!detecteCommercial(file.name),
          detecteMois: lu.type === 'recap' ? true : !!detecteMois(file.name),
          ...lu
        });
      }catch(err){
        COMPTA.push({fichier:file.name, erreur: err.message, lignes:[], somme:0});
      }
      if(--restants === 0){ input.value = ''; render(); }
    };
    r.onerror = () => { if(--restants === 0) render(); };
    r.readAsArrayBuffer(file);
  });
}

function comptaMaj(i, champ, val){ COMPTA[i][champ] = val; render(); }
function comptaRetirer(i){ COMPTA.splice(i,1); render(); }
function comptaVider(){ COMPTA = []; render(); }

function validerCompta(){
  const prets = COMPTA.filter(x => !x.erreur && x.lignes.length);
  if(!prets.length){ toast('Aucun relevé exploitable.', 'bad'); return; }

  let crees = 0, majs = 0, moisTraites = 0, tauxEcrits = 0;
  const rattache = (nom, com) => {
    let c = findClient(nom, com);
    if(!c){ c = ensureClient(nom, com, {source:'compta'}); crees++; }
    else majs++;
    c.caByMonth = c.caByMonth || {};
    return c;
  };

  prets.forEach(x => {
    if(x.type === 'recap'){
      x.periodes.forEach(p => {
        p.lignes.forEach(l => {
          const c = rattache(l.nom, x.commercial);
          c.caByMonth[p.mois] = Math.round(l.ca * 100) / 100;
          /* La marge de la compta remplace le taux saisi à la main.
             Les avoirs, à chiffre négatif, portent une marge négative
             qu'il faut conserver : seul un chiffre nul est inexploitable. */
          if(l.ca !== 0){
            c.margeByMonth = c.margeByMonth || {};
            /* Deux décimales : au dixième de point, l'arrondi coûtait
               une trentaine d'euros de marge sur un exercice complet. */
            c.margeByMonth[p.mois] = Math.round((l.ca - l.achat)/l.ca * 10000) / 100;
            tauxEcrits++;
          }
        });
        DB.officiels[p.mois] = DB.officiels[p.mois] || {};
        DB.officiels[p.mois][x.commercial] = {
          ca: Math.round(p.ca * 100) / 100,
          marge: Math.round((p.ca - p.achat) * 100) / 100
        };
        moisTraites++;
      });
    } else {
      x.lignes.forEach(l => {
        const c = rattache(l.nom, x.commercial);
        c.caByMonth[x.mois] = Math.round(l.montant * 100) / 100;
      });
      DB.officiels[x.mois] = DB.officiels[x.mois] || {};
      const ex = DB.officiels[x.mois][x.commercial] || {};
      DB.officiels[x.mois][x.commercial] = {
        ca: Math.round((x.total != null ? x.total : x.somme) * 100) / 100,
        marge: ex.marge != null ? ex.marge : null
      };
      moisTraites++;
    }
  });

  const partages = nomsPartages().length;
  save();
  toast(`${moisTraites} mois importés — ${majs} clients mis à jour, ${crees} créés${tauxEcrits?', '+tauxEcrits+' taux de marge':''}`, 'ok');
  if(partages) setTimeout(() => toast(
    `${partages} nom${partages>1?'s':''} de client présent${partages>1?'s':''} chez plusieurs commerciaux : des fiches distinctes ont été conservées.`), 900);
  COMPTA = [];
  render();
}

/* ==========================================================================
   Google Drive — sauvegarde et restauration
   Scope drive.file : l'application ne voit que le fichier qu'elle a créé.
   Aucun accès au reste du Drive, ni en lecture ni en écriture.
   ========================================================================== */
const GFILE = 'givedis-os.json';
/* Identifiant OAuth repris du CRM GIVEDIS : même compte, même domaine autorisé. */
const GCLIENT_DEFAUT = '379204671270-vd52napgkkgq9dsqq0cl8v4pihie4nst.apps.googleusercontent.com';

const G = { libs:false, pret:false, chargement:false, tokenClient:null,
            token:null, expire:0, busy:false, err:null, resolve:null, reject:null };

function gConf(){
  DB.settings = DB.settings || {};
  DB.settings.google = DB.settings.google || {clientId:'', fileId:null, auto:true, last:null, compte:null};
  return DB.settings.google;
}
function gClientId(){ return (gConf().clientId || '').trim() || GCLIENT_DEFAUT; }
function gConnecte(){ return !!G.token && Date.now() < G.expire; }
function gOrigine(){ try{ return window.location.origin; }catch(e){ return ''; } }
function gOrigineValide(){ const o = gOrigine(); return /^https:\/\//.test(o) || /^http:\/\/localhost/.test(o); }

function gScript(src){
  return new Promise((ok, ko) => {
    if([...document.scripts].some(s => s.src === src)) return ok();
    const s = document.createElement('script');
    s.src = src; s.async = true; s.defer = true;
    s.onload = ok;
    s.onerror = () => ko(new Error('Bibliothèque Google inaccessible : ' + src));
    document.head.appendChild(s);
  });
}

/* Charge les bibliotheques et instancie le client OAuth une fois pour toutes,
   pour que le clic n'ait plus qu'a ouvrir la fenetre — sans quoi le navigateur
   la bloque, ayant perdu le lien avec le geste de l'utilisateur. */
function gPreparer(){
  if(G.pret) return Promise.resolve();
  if(G.chargement) return G.chargement;

  G.chargement = gScript('https://apis.google.com/js/api.js')
    .then(() => gScript('https://accounts.google.com/gsi/client'))
    .then(() => new Promise(ok => gapi.load('client', ok)))
    .then(() => gapi.client.init({discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']}))
    .then(() => {
      G.libs = true;
      G.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: gClientId(),
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (rep) => {
          if(rep && rep.error){
            G.err = rep.error_description || rep.error;
            if(G.reject) G.reject(new Error(G.err));
          } else {
            G.token = rep.access_token;
            G.expire = Date.now() + ((+rep.expires_in || 3600) - 120) * 1000;
            G.err = null;
            gapi.client.setToken({access_token: G.token});
            if(G.resolve) G.resolve(G.token);
          }
          G.resolve = G.reject = null;
        },
        error_callback: (e) => {
          const m = (e && e.type) || '';
          G.err = m === 'popup_closed'       ? "Fenêtre Google fermée avant la fin de la connexion."
                : m === 'popup_failed_to_open'? "Le navigateur a bloqué la fenêtre Google. Autorisez les fenêtres surgissantes pour ce site, puis réessayez."
                : (e && e.message) || 'Connexion refusée par Google.';
          if(G.reject) G.reject(new Error(G.err));
          G.resolve = G.reject = null;
          const el = document.getElementById('gEtat'); if(el) el.innerHTML = gBadge();
          const d = document.getElementById('gDiag'); if(d) d.innerHTML = gDiagnostic();
        }
      });
      G.pret = true;
    })
    .catch(e => { G.err = e.message; G.chargement = null; throw e; });

  return G.chargement;
}

/* Doit etre appelee directement depuis le clic. */
function gDemanderJeton(){
  return new Promise((ok, ko) => {
    if(!G.tokenClient) return ko(new Error("Bibliothèque Google pas encore chargée."));
    G.resolve = ok; G.reject = ko;
    try{ G.tokenClient.requestAccessToken(); }
    catch(e){ G.resolve = G.reject = null; ko(e); }
  });
}

function gConnexion(silencieux){
  if(gConnecte()) return Promise.resolve(G.token);
  return gPreparer().then(() => new Promise((ok, ko) => {
    G.resolve = ok; G.reject = ko;
    try{ G.tokenClient.requestAccessToken(silencieux ? {prompt:''} : {}); }
    catch(e){ G.resolve = G.reject = null; ko(e); }
  }));
}

/* Retrouve le fichier de sauvegarde, ou renvoie null s'il n'existe pas encore. */
function gTrouverFichier(){
  return gapi.client.drive.files.list({
    q: "name='" + GFILE + "' and trashed=false",
    fields: 'files(id,name,modifiedTime,size)',
    spaces: 'drive', pageSize: 10
  }).then(r => {
    const f = (r.result.files || [])[0];
    if(f) gConf().fileId = f.id;
    return f || null;
  });
}

function gEnvoyer(){
  if(G.busy) return Promise.resolve();
  G.busy = true;
  const conf = gConf();
  const contenu = JSON.stringify(DB);
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({name: GFILE, mimeType:'application/json'})], {type:'application/json'}));
  form.append('file', new Blob([contenu], {type:'application/json'}));

  const majFileId = conf.fileId
    ? Promise.resolve(conf.fileId)
    : gTrouverFichier().then(f => f ? f.id : null);

  return majFileId.then(id => {
    const url = id
      ? 'https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    return fetch(url, {
      method: id ? 'PATCH' : 'POST',
      headers: {Authorization: 'Bearer ' + G.token},
      body: form
    });
  }).then(r => {
    if(!r.ok) return r.text().then(t => { throw new Error('Drive a refusé l\'envoi (' + r.status + ')'); });
    return r.json();
  }).then(f => {
    conf.fileId = f.id;
    conf.last = new Date().toISOString();
    G.err = null;
    localStorage.setItem(LS, JSON.stringify(DB));
    return f;
  }).finally(() => { G.busy = false; });
}

function gRecuperer(){
  return gTrouverFichier().then(f => {
    if(!f) throw new Error('Aucune sauvegarde trouvée sur ce compte Drive.');
    return fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media',
      {headers:{Authorization:'Bearer ' + G.token}})
      .then(r => { if(!r.ok) throw new Error('Téléchargement impossible (' + r.status + ')'); return r.json(); })
      .then(d => ({fichier:f, data:d}));
  });
}

let gTimer = null;
function gAuto(){
  const conf = (DB.settings && DB.settings.google) || null;
  if(!conf || !conf.auto || !gConnecte()) return;
  clearTimeout(gTimer);
  gTimer = setTimeout(() => {
    gEnvoyer()

  return `<span class="tag ok">connecté${conf.last ? ' · dernier envoi ' + new Date(conf.last).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</span>`;
}

function gSeConnecter(){
  if(!gOrigineValide()){
    G.err = "Cette page est ouverte depuis " + (gOrigine() || 'une origine locale') +
            ". Google n'autorise la connexion que depuis une adresse https — déployez l'application, puis réessayez.";
    render(); return;

  if(!G.pret){
    G.err = "Les bibliothèques Google finissent de charger. Réessayez dans deux secondes.";
    render();
    gPreparer().then(() => { G.err = null; render(); }).catch(() => render());

  gDemanderJeton()
    .then(() => gTrouverFichier())

function gRestaurer(mode){
  if(!gConnecte()){ gSeConnecter(); return; }
  gRecuperer().then(({fichier, data}) => {
    if(mode === 'remplacer'){
      if(!data.clients || !data.commerciaux) throw new Error('Le fichier ne ressemble pas à une sauvegarde GIVEDIS OS.');

}

function gDeconnecter(){
  if(G.token && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(G.token); }catch(e){}
  }
  G.token = null; G.expire = 0; G.err = null;

      <span id="gEtat">${gBadge()}</span>
    </div>
    <p class="hint" style="margin-bottom:14px">Un seul fichier, <span class="mono">${GFILE}</span>, déposé sur votre Drive. L'application n'accède qu'à ce fichier : le scope <span class="mono">drive.file</span> ne donne aucun droit sur le reste de vos documents.</p>

    <div class="btnrow">
      ${gConnecte()
        ? `<button class="btn" onclick="gSauvegarder()">Envoyer maintenant</button>
           <button class="btn ghost" onclick="gRestaurer('fusionner')">Récupérer et fusionner</button>
           <button class="btn ghost" onclick="gRestaurer('remplacer')">Récupérer et remplacer</button>
           <button class="btn ghost" onclick="gDeconnecter()">Se déconnecter</button>`
        : `<button class="btn" onclick="gSeConnecter()">Se connecter à Google Drive</button>`}
    </div>

    ${G.err ? `<div class="note warn" style="margin-top:14px">${esc(G.err)}</div>` : ''}

    ${!gOrigineValide() ? `<div class="note warn" style="margin-top:14px">
      <strong>La connexion ne peut pas aboutir depuis cette adresse.</strong> Google refuse les origines locales et les aperçus.
      Déposez le fichier sur votre dépôt GitHub Pages et ouvrez-le depuis <span class="mono">https://gratzob.github.io</span> :
      c'est l'origine déjà autorisée pour l'identifiant du CRM.
    </div>` : ''}

    ${gConnecte() ? `<div class="note ok" style="margin-top:14px">
      <strong>Fusionner</strong> ajoute ce qui manque sans rien écraser — c'est le choix sûr au quotidien.
      <strong>Remplacer</strong> écrase intégralement les données de cet appareil par celles du Drive : à réserver au cas où vous repartez d'une machine vide.
    </div>` : ''}
  </div>

  <div class="card">
    <div class="card-h"><h3>Réglages</h3><button class="btn sm" onclick="gMajReglages()">Enregistrer</button></div>
    <div class="grid g2">
      <div>
        <label class="f" for="gAutoSel">Sauvegarde automatique</label>
        <select id="gAutoSel">
          <option value="1" ${conf.auto?'selected':''}>Oui — après chaque modification</option>
          <option value="0" ${!conf.auto?'selected':''}>Non — envoi manuel uniquement</option>
        </select>
        <p class="hint" style="margin-top:8px">L'envoi part quatre secondes après la dernière modification, pour regrouper les changements d'une même saisie en un seul appel.</p>
      </div>
      <div>
        <label class="f" for="gClient">Identifiant client OAuth</label>
        <input id="gClient" value="${esc(conf.clientId||'')}" placeholder="${esc(GCLIENT_DEFAUT)}" style="font-family:JetBrains Mono,monospace;font-size:11.5px">
        <p class="hint" style="margin-top:8px">Laissez vide pour utiliser celui du CRM GIVEDIS. À renseigner seulement si vous créez un projet Google dédié.</p>
      </div>
    </div>
    ${conf.fileId ? `<p class="hint" style="margin-top:14px">Fichier Drive rattaché : <span class="mono">${esc(conf.fileId)}</span></p>` : ''}
  </div>

  <div class="card">
    <div class="card-h"><h3>Diagnostic</h3><button class="btn ghost sm" onclick="gPreparer().then(render).catch(render)">Recharger</button></div>
    <div id="gDiag">${gDiagnostic()}</div>
    <p class="hint" style="margin-top:12px">Si la fenêtre Google ne s'ouvre pas alors que tout est au vert ci-dessus, c'est le blocage des fenêtres surgissantes du navigateur. Autorisez-les pour ce site et réessayez.</p>
  </div>

  <div class="card">
    <div class="card-h"><h3>Ce que la synchronisation fait, et ne fait pas</h3></div>
    <div class="note">Elle vous permet de retrouver vos données sur un autre poste, et vous protège d'un effacement du navigateur. Elle ne rend pas l'application multi-utilisateur : Clément et Lorris continuent d'envoyer leurs visites par fichier, que vous importez.</div>
    <p class="hint" style="margin-top:12px">La connexion Google expire au bout d'une heure environ. Passé ce délai, l'envoi automatique s'interrompt jusqu'à la reconnexion — l'état ci-dessus vous l'indique, et la sauvegarde locale, elle, continue de fonctionner sans interruption.</p>
  </div>`;
};

AFTER['data:drive'] = () => {
  if(!gOrigineValide()) return;
  gPreparer().then(() => {
    const d = document.getElementById('gDiag'); if(d) d.innerHTML = gDiagnostic();
    const conf = gConf();
    /* Reconnexion discrète si l'accord a déjà été donné auparavant. */
    if(!gConnecte() && conf.fileId){
      gConnexion(true).then(() => {
        const el = document.getElementById('gEtat'); if(el) el.innerHTML = gBadge();
        const d2 = document.getElementById('gDiag'); if(d2) d2.innerHTML = gDiagnostic();
      }).catch(() => {});
    }
  }).catch(() => {
    const d = document.getElementById('gDiag'); if(d) d.innerHTML = gDiagnostic();
  });
};


</script>
<script src="lecture.js"></script>
</body>
</html>
